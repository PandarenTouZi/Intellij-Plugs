<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#1c1326" />
      <stop offset="60%" stop-color="#100b17" />
      <stop offset="100%" stop-color="#07040a" />
    </radialGradient>

    <!-- Metallic/Neon Gradient for 'A' -->
    <linearGradient id="aBodyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff416c" />
      <stop offset="50%" stop-color="#ff4b2b" />
      <stop offset="100%" stop-color="#7b2cbf" />
    </linearGradient>

    <!-- Metallic/Neon Gradient for 'T' -->
    <linearGradient id="tBodyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#0000ff" />
    </linearGradient>

    <!-- Shared Accent Gradient -->
    <linearGradient id="accentGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="100%" stop-color="#7928ca" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="neonGlowA" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur1" />
      <feGaussianBlur stdDeviation="20" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="neonGlowT" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur1" />
      <feGaussianBlur stdDeviation="20" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="15" stdDeviation="15" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="500" fill="url(#bgGlow)" />

  <!-- Main Monogram Group -->
  <g filter="url(#dropShadow)" transform="translate(40, 40)">
    
    <!-- Outer Glow for 'A' -->
    <path d="M 175 90 
             L 245 310 
             L 190 310 
             L 175 260 
             L 115 260 
             L 100 310 
             L 45 310 
             L 115 90 
             Z 
             M 145 155 
             L 127 215 
             L 163 215 
             Z" fill="none" stroke="#ff416c" stroke-width="3" filter="url(#neonGlowA)" opacity="0.8" />

    <!-- 3D Extrusion Layer for 'A' -->
    <path d="M 185 100 
             L 255 320 
             L 200 320 
             L 185 270 
             L 125 270 
             L 110 320 
             L 55 320 
             L 125 100 
             Z" fill="url(#accentGradient)" opacity="0.6" />

    <!-- Main Front Face for 'A' -->
    <path d="M 165 80 
             L 235 300 
             L 180 300 
             L 165 250 
             L 105 250 
             L 90 300 
             L 35 300 
             L 105 80 
             Z 
             M 135 145 
             L 117 205 
             L 153 205 
             Z" fill="url(#aBodyGradient)" />

    <!-- Top Highlight Cut for 'A' -->
    <path d="M 165 80 
             L 235 300 
             L 210 300 
             L 155 120 
             L 100 280 
             L 35 300 
             L 105 80 
             Z" fill="#ffffff" opacity="0.25" />

    <!-- Outer Glow for 'T' -->
    <path d="M 215 90 
             L 385 90 
             L 385 145 
             L 330 145 
             L 330 310 
             L 270 310 
             L 270 145 
             L 215 145 
             Z" fill="none" stroke="#00f2fe" stroke-width="3" filter="url(#neonGlowT)" opacity="0.8" />

    <!-- 3D Extrusion Layer for 'T' -->
    <path d="M 225 100 
             L 395 100 
             L 395 155 
             L 340 155 
             L 340 320 
             L 280 320 
             L 280 155 
             L 225 155 
             Z" fill="#0000ff" opacity="0.5" />

    <!-- Main Front Face for 'T' -->
    <path d="M 205 80 
             L 375 80 
             L 375 135 
             L 320 135 
             L 320 300 
             L 260 300 
             L 260 135 
             L 205 135 
             Z" fill="url(#tBodyGradient)" />

    <!-- Top Highlight Cut for 'T' -->
    <path d="M 205 80 
             L 375 80 
             L 375 95 
             L 220 95 
             L 260 135 
             L 260 300 
             L 245 300 
             L 245 135 
             L 205 135 
             Z" fill="#ffffff" opacity="0.2" />

  </g>
</svg>